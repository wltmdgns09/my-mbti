<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI로 포켓몬 찾기</title>
<style>
  :root{
    --cream:#FFF8E1;
    --card:#FFF3C4;
    --yellow:#FFC93C;
    --yellow-deep:#FFB100;
    --orange:#FF8A3D;
    --brown:#5A4632;
    --brown-soft:#8A7256;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 20% 10%, #FFF3C4 0%, var(--cream) 45%, #FFECB3 100%);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color: var(--brown);
    display:flex;
    justify-content:center;
    padding: 32px 16px 64px;
  }

  .wrap{
    width:100%;
    max-width: 720px;
  }

  header{
    text-align:center;
    margin-bottom: 28px;
  }

  .badge{
    display:inline-block;
    background: var(--yellow);
    color: var(--brown);
    font-weight:800;
    font-size: 15px;
    padding: 6px 18px;
    border-radius: 999px;
    margin-bottom: 14px;
    box-shadow: 0 3px 0 var(--yellow-deep);
  }

  h1{
    font-size: clamp(28px, 6vw, 40px);
    margin: 0 0 10px;
    font-weight: 900;
    line-height: 1.3;
  }

  p.sub{
    font-size: 18px;
    color: var(--brown-soft);
    margin: 0;
    line-height: 1.6;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 30px;
  }

  @media (max-width: 520px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
  }

  .mbti-btn{
    background: var(--card);
    border: none;
    border-radius: 18px;
    padding: 20px 8px;
    font-size: 20px;
    font-weight: 900;
    color: var(--brown);
    cursor:pointer;
    box-shadow: 0 5px 0 var(--yellow-deep);
    transition: transform .12s ease, box-shadow .12s ease;
  }

  .mbti-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 8px 0 var(--yellow-deep);
  }

  .mbti-btn:active{
    transform: translateY(2px);
    box-shadow: 0 2px 0 var(--yellow-deep);
  }

  .mbti-btn:focus-visible{
    outline: 3px solid var(--orange);
    outline-offset: 3px;
  }

  /* 결과 카드 */
  .result{
    display:none;
    margin-top: 30px;
    background: #FFFDF6;
    border-radius: 28px;
    padding: 36px 28px;
    text-align:center;
    box-shadow: 0 10px 0 var(--yellow-deep), 0 14px 28px rgba(90,70,50,0.12);
    animation: pop .35s ease;
  }

  @keyframes pop{
    from{ opacity:0; transform: scale(.92) translateY(8px); }
    to{ opacity:1; transform: scale(1) translateY(0); }
  }

  .result.show{ display:block; }

  .result-type{
    display:inline-block;
    background: var(--orange);
    color: #fff;
    font-weight:800;
    font-size: 15px;
    padding: 5px 16px;
    border-radius: 999px;
    margin-bottom: 18px;
  }

  .emoji-big{
    font-size: 96px;
    line-height: 1;
    margin-bottom: 6px;
  }

  .poke-name{
    font-size: 30px;
    font-weight: 900;
    margin: 4px 0 14px;
  }

  .reason{
    font-size: 18px;
    line-height: 1.7;
    color: var(--brown);
    max-width: 440px;
    margin: 0 auto 26px;
  }

  .match-box{
    background: var(--card);
    border-radius: 18px;
    padding: 16px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 14px;
    margin-bottom: 26px;
  }

  .match-emoji{ font-size: 40px; }

  .match-text{
    text-align:left;
    font-size: 15px;
    line-height: 1.5;
  }

  .match-text b{
    font-size: 17px;
  }

  .reset-btn{
    background: var(--yellow);
    border:none;
    color: var(--brown);
    font-weight: 900;
    font-size: 18px;
    padding: 14px 32px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 5px 0 var(--yellow-deep);
    transition: transform .12s ease;
  }

  .reset-btn:hover{ transform: translateY(-2px); }
  .reset-btn:active{ transform: translateY(2px); box-shadow: 0 2px 0 var(--yellow-deep); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="badge">성격 유형 테스트 아님, 그냥 재미로!</span>
    <h1>나와 닮은 포켓몬은?</h1>
    <p class="sub">MBTI 유형을 하나 골라보세요.<br>어울리는 포켓몬을 보여드릴게요.</p>
  </header>

  <div class="grid" id="grid"></div>

  <div class="result" id="result">
    <span class="result-type" id="resultType"></span>
    <div class="emoji-big" id="resultEmoji"></div>
    <div class="poke-name" id="resultName"></div>
    <div class="reason" id="resultReason"></div>

    <div class="match-box">
      <div class="match-emoji" id="matchEmoji"></div>
      <div class="match-text" id="matchText"></div>
    </div>

    <button class="reset-btn" id="resetBtn">다시 고르기</button>
  </div>
</div>

<script>
  const DATA = {
    INTJ: { name: "뮤츠", emoji: "🧠", reason: "혼자만의 세계에서 큰 그림을 그리는 전략가예요.<br>목표를 향해 조용히, 하지만 강력하게 나아가는 모습이 꼭 닮았어요.", match: "ENFP" },
    INTP: { name: "로토무", emoji: "💡", reason: "궁금한 건 못 참고 끝까지 파고드는 탐구자예요.<br>새로운 아이디어와 이론을 갖고 노는 걸 좋아하죠.", match: "ENTJ" },
    ENTJ: { name: "리자몽", emoji: "🔥", reason: "확신에 찬 리더십으로 무리를 이끄는 타입이에요.<br>큰 목표 앞에서 망설이지 않고 뜨겁게 밀어붙여요.", match: "INFP" },
    ENTP: { name: "겐가", emoji: "👻", reason: "재치 넘치는 말로 분위기를 뒤집는 걸 즐겨요.<br>남들이 못 보는 각도에서 아이디어를 던지는 장난꾸러기죠.", match: "INFJ" },
    INFJ: { name: "뮤", emoji: "✨", reason: "잘 보이지 않지만 깊은 통찰로 주변을 살피는 타입이에요.<br>신비롭고 따뜻한 기운이 은은하게 느껴지는 존재죠.", match: "ENTP" },
    INFP: { name: "이브이", emoji: "🌟", reason: "정해진 하나의 모습보다 무한한 가능성을 품고 있어요.<br>자기만의 가치관을 소중히 여기는 순수한 이상주의자예요.", match: "ENTJ" },
    ENFJ: { name: "피카츄", emoji: "⚡", reason: "밝은 에너지로 주변 사람들을 이끄는 타입이에요.<br>다른 사람의 마음을 잘 챙기는 다정한 리더죠.", match: "INFP" },
    ENFP: { name: "부스터", emoji: "🔥", reason: "열정 가득한 텐션으로 어디서든 분위기를 살려요.<br>즉흥적이고 사교적이라 새로운 만남을 두려워하지 않죠.", match: "INTJ" },
    ISTJ: { name: "마기라스", emoji: "🗿", reason: "묵묵하고 단단하게 원칙을 지키는 타입이에요.<br>한번 믿으면 끝까지 책임지는 든든한 존재죠.", match: "ESFP" },
    ISFJ: { name: "픽시", emoji: "🌸", reason: "조용히 주변을 살피고 돌보는 걸 좋아해요.<br>따뜻한 마음으로 남을 먼저 챙기는 헌신적인 타입이에요.", match: "ESTP" },
    ESTJ: { name: "루카리오", emoji: "🥋", reason: "체계적으로 계획을 세우고 딱딱 실행하는 타입이에요.<br>맡은 일은 확실하게 해내는 원칙주의자죠.", match: "ISFP" },
    ESFJ: { name: "라프라스", emoji: "🌊", reason: "주변 사람을 살뜰히 챙기며 함께 가는 걸 좋아해요.<br>다정하고 사교적이라 누구와도 잘 어울리죠.", match: "ISTP" },
    ISTP: { name: "개굴닌자", emoji: "🥷", reason: "필요할 때 조용히 나타나 문제를 해결하는 타입이에요.<br>말보다 행동으로 능력을 보여주는 걸 좋아하죠.", match: "ESFJ" },
    ISFP: { name: "세레비", emoji: "🍃", reason: "자기만의 감성과 속도로 세상을 즐기는 타입이에요.<br>화려하지 않아도 자연스러운 매력이 있어요.", match: "ESTJ" },
    ESTP: { name: "윈디", emoji: "🐕", reason: "망설임 없이 바로 몸을 움직이는 행동파예요.<br>에너지 넘치고 순발력이 뛰어나 위기에도 강하죠.", match: "ISFJ" },
    ESFP: { name: "푸린", emoji: "🎤", reason: "무대 위에서 가장 빛나는 흥 많은 타입이에요.<br>즐거운 분위기를 만드는 데 타고난 재능이 있어요.", match: "ISTJ" }
  };

  const grid = document.getElementById("grid");
  const result = document.getElementById("result");

  Object.keys(DATA).forEach(type => {
    const btn = document.createElement("button");
    btn.className = "mbti-btn";
    btn.textContent = type;
    btn.addEventListener("click", () => showResult(type));
    grid.appendChild(btn);
  });

  function showResult(type){
    const info = DATA[type];
    const matchInfo = DATA[info.match];

    document.getElementById("resultType").textContent = type;
    document.getElementById("resultEmoji").textContent = info.emoji;
    document.getElementById("resultName").textContent = info.name;
    document.getElementById("resultReason").innerHTML = info.reason;

    document.getElementById("matchEmoji").textContent = matchInfo.emoji;
    document.getElementById("matchText").innerHTML =
      "찰떡 궁합 유형<br><b>" + info.match + " · " + matchInfo.name + "</b>";

    grid.style.display = "none";
    result.classList.add("show");
    result.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    result.classList.remove("show");
    grid.style.display = "grid";
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
</script>

</body>
</html>
